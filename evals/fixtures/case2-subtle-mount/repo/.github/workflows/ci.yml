name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        run: for f in *.js scripts/*.js test/*.js; do node --check "$f"; done
      - name: tina.js stays tiny
        run: node scripts/count-lines.js tina.js --max 62
      - name: Build the sandbox
        run: docker build -t tina-sandbox sandbox/
      - name: Tests (fake model, real sandbox, no API key)
        run: node --test
